[project]
name = "akrun"
version = "0.1.0.dev0"
description = "Thin, recoverable agent evaluation runner built on AKernel"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "wayne" }]
dependencies = [
    "akernel-sdk==0.2.0rc3",
]

[project.urls]
Homepage = "https://github.com/rcyw/akrun"
Repository = "https://github.com/rcyw/akrun"
Issues = "https://github.com/rcyw/akrun/issues"

[project.scripts]
akrun = "akrun.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akrun"]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pyright>=1.1.405",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
