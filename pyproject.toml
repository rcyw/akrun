[project]
name = "axrun"
version = "0.1.0.dev0"
description = "Thin, recoverable agent evaluation runner built on Axern"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "cofy-x" }]
dependencies = [
    "axern-sdk==0.12.1",
]

[project.urls]
Homepage = "https://github.com/cofy-x/axrun"
Repository = "https://github.com/cofy-x/axrun"
Issues = "https://github.com/cofy-x/axrun/issues"

[project.scripts]
axrun = "axrun.cli:main"

[project.optional-dependencies]
kova = [
    "kova-client==0.1.0rc9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axrun"]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "kova-client==0.1.0rc9",
    "pyright>=1.1.405",
    "pytest>=8.3.5",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
