name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
      - run: uv build
      - name: Smoke installed wheel CLI outside source tree
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/axrun-wheel-venv"
          uv pip install --python "$RUNNER_TEMP/axrun-wheel-venv/bin/python" dist/*.whl
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$RUNNER_TEMP/axrun-wheel-venv/bin/axrun" --help
